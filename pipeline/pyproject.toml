[project]
name = "boardtape-pipeline"
version = "0.1.0"
description = "Ingestion, reconciliation, validation and analytics jobs for Boardtape"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.2",
  "psycopg[binary]>=3.2",
]

[project.scripts]
bt = "bt.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt"]

# Personal project: resolve from public PyPI regardless of any machine-level index config.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long SQL literals read better unwrapped.
"src/bt/quality/checks.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
